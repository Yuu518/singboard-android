name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-android:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64
            rust-target: aarch64-linux-android
            flavor: arm64
          - abi: armeabi-v7a
            target: armv7
            rust-target: armv7-linux-androideabi
            flavor: arm
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          tag=$(git describe --tags --abbrev=0) || { echo "No tag found in the repository; push a tag before building"; exit 1; }
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Require signing secrets
        run: |
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret $name; release APKs must be signed with the same key to update in place"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.13.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
          add-job-summary: never

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk
        with:
          ndk-version: r30
          local-cache: true

      - name: Export NDK path
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}
          env-vars: NDK_HOME
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Write signing config
        working-directory: src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          pnpm tauri android build --apk --split-per-abi --target ${{ matrix.target }} --config "{\"version\":\"$APP_VERSION\"}"

      - name: Collect APK
        run: |
          mkdir -p release
          cp "src-tauri/gen/android/app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk" "release/singboard-${{ matrix.abi }}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/singboard-${{ matrix.abi }}.apk"

      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/release.jks src-tauri/gen/android/keystore.properties

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.abi }}
          path: release/singboard-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release tag
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "APP_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Download APKs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: apk-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          ls -l release
          (cd release && sha256sum *.apk > SHA256SUMS.txt)

      - name: Set build time
        run: echo "DATE=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') UTC+8" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_VERSION }}
          body: |
            Build time: ${{ env.DATE }}
          files: |
            release/*.apk
